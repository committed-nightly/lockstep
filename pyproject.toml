[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockstep"
version = "0.1.0"
description = "Check that files which are supposed to change together actually did."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "lockfile", "codegen", "ci", "pre-commit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lockstep = "lockstep.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/lockstep"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
