name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The tests make their own commits. Each temp repo sets a local identity,
      # so this is only a backstop against a runner with no global one at all.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pytest

  lockstep:
    # Dogfood. This is the exact invocation the README recommends, so if the
    # advice in there ever stops working, this job is what notices.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          git fetch -q origin ${{ github.base_ref }}
          lockstep --since origin/${{ github.base_ref }} --squash
